name: Обновить базу машин

# Кнопка запуска — во вкладке репозитория "Actions" -> "Обновить базу машин" -> "Run workflow".
# Перед первым запуском добавьте секрет APIFY_API_TOKEN (токен из аккаунта apify.com):
# Settings -> Secrets and variables -> Actions -> New repository secret.
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Синхронизация с Apify (che168, dongchedi, encar)
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: node scripts/sync-cars.js

      - name: Сохранить обновлённый каталог
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cars.js
          git diff --cached --quiet || git commit -m "Автообновление каталога машин из Apify (che168/dongchedi/encar)"
          git push
